<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고1 아침 공부 챌린지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 sm:p-6">

    <div id="app" class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[90vh]">
        
        <div id="view-container" class="flex-1 flex flex-col">
            <!-- 동적 뷰가 여기에 렌더링됨 -->
        </div>

    </div>

    <!-- 카메라 직접 촬영 모달 컨테이너 -->
    <div id="camera-modal" class="fixed inset-0 bg-black/80 flex flex-col items-center justify-center z-50 hidden p-4">
        <div class="w-full max-w-sm bg-slate-900 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
            <div class="p-4 bg-slate-800 text-white flex justify-between items-center">
                <h3 class="text-sm font-bold">📸 실시간 카메라 촬영</h3>
                <button id="close-camera-btn" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
            </div>
            <div class="relative w-full bg-black flex-1 flex items-center justify-center min-h-[320px]">
                <video id="camera-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
                <canvas id="camera-canvas" class="hidden"></canvas>
            </div>
            <div class="p-4 bg-slate-800 flex justify-center items-center space-x-4">
                <button id="capture-btn" class="w-16 h-16 bg-white rounded-full border-4 border-indigo-600 shadow-lg hover:bg-slate-200 transition active:scale-95 flex items-center justify-center">
                    <div class="w-12 h-12 bg-indigo-600 rounded-full"></div>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 선생님의 Google Apps Script 웹 앱 URL을 코드 내에서 직접 관리함 (필요시 교체함)
        const FIXED_GAS_URL = "https://script.google.com/macros/s/AKfycbwgARnkWYyAJVWpIydA9FoY141XgFmc7zK9NmPI3v3iR0sAzh2iLENEv3zoiES5bETj/exec";

        let state = {
            nickname: localStorage.getItem('morning_study_nickname') || '',
            streak: parseInt(localStorage.getItem('morning_study_streak') || '0', 10),
            currentTab: 'challenge', // 'challenge' 또는 'feed'
            resolution: localStorage.getItem('morning_study_resolution') || '',
            imagePreview: localStorage.getItem('morning_study_image') || null,
            gasUrl: FIXED_GAS_URL,
            feedList: JSON.parse(localStorage.getItem('morning_study_feed') || '[]'),
            isLoggedIn: !!localStorage.getItem('morning_study_nickname'),
            isLoadingFeed: false
        };

        let mediaStream = null;

        function showMessage(msg, callback) {
            const existingModal = document.getElementById('custom-modal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'custom-modal';
            modal.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl text-center">
                    <p class="text-base font-medium text-slate-800 mb-5">${msg}</p>
                    <button id="modal-ok-btn" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition">확인함</button>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('modal-ok-btn').onclick = () => {
                modal.remove();
                if (callback) callback();
            };
        }

        function render() {
            const container = document.getElementById('view-container');
            if (!state.isLoggedIn) {
                container.innerHTML = renderLoginView();
                bindLoginEvents();
            } else {
                container.innerHTML = renderMainView();
                bindMainEvents();
            }
        }

        function renderLoginView() {
            return `
                <div class="p-6 sm:p-8 flex flex-col justify-center flex-1 text-center">
                    <div class="mb-8">
                        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold shadow-sm">🌅</div>
                        <h1 class="text-2xl font-bold text-slate-900 mb-2">고1 아침 공부 인증</h1>
                        <p class="text-sm text-slate-500">닉네임을 입력하고 아침 공부를 시작함.</p>
                    </div>
                    <form id="login-form" class="space-y-4">
                        <div class="text-left">
                            <label class="block text-xs font-semibold text-slate-600 mb-1 ml-1">닉네임 (이름 또는 별명)</label>
                            <input type="text" id="nickname-input" required placeholder="예: 김고딩" 
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 bg-slate-50 text-base">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition">
                            시작하기
                        </button>
                    </form>
                </div>
            `;
        }

        function bindLoginEvents() {
            const form = document.getElementById('login-form');
            form.onsubmit = (e) => {
                e.preventDefault();
                const val = document.getElementById('nickname-input').value.trim();
                if (!val) {
                    showMessage("닉네임을 정확히 입력함.");
                    return;
                }
                state.nickname = val;
                state.isLoggedIn = true;
                localStorage.setItem('morning_study_nickname', val);
                render();
            };
        }

        function renderMainView() {
            const isConnected = state.gasUrl && !state.gasUrl.includes("여기에");
            return `
                <!-- 상단 헤더 및 누적 일수 표시 -->
                <div class="bg-indigo-600 text-white p-5 rounded-b-3xl shadow-md">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-500/50 text-xs px-2.5 py-1 rounded-full font-medium">고1 담임반</span>
                            <span class="font-semibold text-sm">${state.nickname}님</span>
                        </div>
                        <button id="logout-btn" class="text-xs bg-indigo-500/60 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg transition">로그아웃</button>
                    </div>
                    
                    <!-- 스프레드시트 연동 상태 바 -->
                    <div class="mb-3 px-3 py-1.5 bg-indigo-800/40 rounded-xl flex items-center justify-between text-[11px] text-indigo-100 border border-indigo-400/20">
                        <span class="truncate">🔗 스프레드시트 연동: <strong class="${isConnected ? 'text-emerald-300' : 'text-amber-300'}">${isConnected ? '코드 내 URL 연동됨' : '미연동 상태'}</strong></span>
                    </div>

                    <div class="bg-indigo-700/50 rounded-2xl p-4 flex items-center justify-between border border-indigo-500/30">
                        <div>
                            <p class="text-xs text-indigo-200 font-medium mb-0.5">나의 누적 아침 공부 일수</p>
                            <h2 class="text-3xl font-extrabold tracking-tight">${state.streak} <span class="text-lg font-normal">일째 달성 중</span></h2>
                        </div>
                        <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-2xl">🔥</div>
                    </div>
                </div>

                <!-- 탭 전환 버튼 -->
                <div class="flex border-b border-slate-100 px-6 pt-4 bg-white">
                    <button data-tab="challenge" class="flex-1 pb-3 text-sm font-semibold text-center border-b-2 transition ${state.currentTab === 'challenge' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-400 hover:text-slate-600'}">
                        나의 챌린지 기록
                    </button>
                    <button data-tab="feed" class="flex-1 pb-3 text-sm font-semibold text-center border-b-2 transition ${state.currentTab === 'feed' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-400 hover:text-slate-600'}">
                        우리 반 피드
                    </button>
                </div>

                <!-- 탭 내용 영역 -->
                <div class="flex-1 p-5 overflow-y-auto bg-slate-50/50">
                    ${state.currentTab === 'challenge' ? renderChallengeTab() : renderFeedTab()}
                </div>
            `;
        }

        function renderChallengeTab() {
            return `
                <div class="space-y-6">
                    <!-- 오늘 나의 결심 섹션 -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <label class="block text-xs font-bold text-slate-700 mb-2 uppercase tracking-wide">💡 오늘 나의 결심</label>
                        <textarea id="resolution-input" rows="3" placeholder="오늘 아침 공부 목표나 각오를 간단히 적어봄." 
                            class="w-full p-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-slate-800 resize-none">${state.resolution}</textarea>
                        <button id="save-resolution-btn" class="mt-2 w-full bg-slate-800 text-white text-xs font-semibold py-2.5 rounded-xl hover:bg-slate-900 transition">
                            결심 저장하기
                        </button>
                    </div>

                    <!-- 사진 인증 섹션 -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <label class="block text-xs font-bold text-slate-700 mb-2 uppercase tracking-wide">📸 아침 공부 인증 사진</label>
                        
                        <!-- 사진 미리보기 영역 -->
                        <div id="image-preview-container" class="mb-3 w-full h-48 bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden relative">
                            ${state.imagePreview ? 
                                `<img src="${state.imagePreview}" class="w-full h-full object-cover">` : 
                                `<div class="text-center p-4 text-slate-400">
                                    <span class="text-3xl block mb-1">📷</span>
                                    <span class="text-xs font-medium">인증 사진이 등록되지 않음</span>
                                 </div>`
                            }
                        </div>

                        <!-- 업로드 및 카메라 촬영 버튼 그룹 -->
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <label class="cursor-pointer bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-semibold py-3 px-3 rounded-xl text-center hover:bg-indigo-100 transition flex items-center justify-center space-x-1.5">
                                <span>📁 파일 등록</span>
                                <input type="file" id="file-upload" accept="image/*" class="hidden">
                            </label>
                            <button type="button" id="open-camera-btn" class="cursor-pointer bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-semibold py-3 px-3 rounded-xl text-center hover:bg-emerald-100 transition flex items-center justify-center space-x-1.5">
                                <span>📸 카메라 촬영</span>
                            </button>
                        </div>

                        <button id="submit-auth-btn" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl text-sm shadow-md shadow-indigo-100 hover:bg-indigo-700 transition">
                            오늘 인증 완료하기 (+1일)
                        </button>
                    </div>
                </div>
            `;
        }

        function renderFeedTab() {
            const feeds = state.feedList;
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center mb-1">
                        <p class="text-xs font-semibold text-slate-500">우리 반 친구들의 실시간 인증 현황임.</p>
                        <button id="refresh-feed-btn" class="text-xs text-indigo-600 font-semibold hover:underline">새로고침</button>
                    </div>
                    ${state.isLoadingFeed ? `
                        <div class="text-center py-12 text-slate-400 text-xs">피드를 불러오는 중...</div>
                    ` : feeds.length === 0 ? `
                        <div class="text-center py-12">
                            <div class="text-4xl mb-3">📭</div>
                            <p class="text-sm font-medium text-slate-500">아직 등록된 반 친구들의 피드가 없음.</p>
                            <p class="text-xs text-slate-400 mt-1">오늘의 챌린지를 완료하고 첫 피드를 공유함!</p>
                        </div>
                    ` : `
                        <div class="space-y-4">
                            ${feeds.map(item => `
                                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-2">
                                            <div class="w-8 h-8 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center font-bold text-xs">
                                                ${item.nickname ? item.nickname.charAt(0) : '익'}
                                            </div>
                                            <div>
                                                <h4 class="text-xs font-bold text-slate-800">${item.nickname || '익명'}</h4>
                                                <span class="text-[10px] text-slate-400">${item.timestamp || ''}</span>
                                            </div>
                                        </div>
                                        <span class="bg-emerald-50 text-emerald-700 text-[10px] font-semibold px-2 py-0.5 rounded-full">🔥 ${item.streak || 1}일째</span>
                                    </div>
                                    ${item.resolution ? `<p class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100">“${item.resolution}”</p>` : ''}
                                    ${item.image ? `<div class="w-full h-40 bg-slate-100 rounded-xl overflow-hidden"><img src="${item.image}" class="w-full h-full object-cover"></div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function bindMainEvents() {
            document.getElementById('logout-btn').onclick = () => {
                if (confirm("정말 로그아웃함?")) {
                    localStorage.removeItem('morning_study_nickname');
                    state.nickname = '';
                    state.isLoggedIn = false;
                    render();
                }
            };

            document.querySelectorAll('[data-tab]').forEach(btn => {
                btn.onclick = (e) => {
                    state.currentTab = e.currentTarget.getAttribute('data-tab');
                    const isConnected = state.gasUrl && !state.gasUrl.includes("여기에");
                    if (state.currentTab === 'feed' && isConnected) {
                        fetchFeedFromGAS();
                    } else {
                        render();
                    }
                };
            });

            if (state.currentTab === 'challenge') {
                const saveResBtn = document.getElementById('save-resolution-btn');
                if (saveResBtn) {
                    saveResBtn.onclick = () => {
                        const val = document.getElementById('resolution-input').value.trim();
                        state.resolution = val;
                        localStorage.setItem('morning_study_resolution', val);
                        showMessage("오늘의 결심이 저장됨.");
                    };
                }

                const fileUpload = document.getElementById('file-upload');
                if (fileUpload) {
                    fileUpload.onchange = (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                state.imagePreview = event.target.result;
                                localStorage.setItem('morning_study_image', state.imagePreview);
                                render();
                            };
                            reader.readAsDataURL(file);
                        }
                    };
                }

                const openCameraBtn = document.getElementById('open-camera-btn');
                if (openCameraBtn) {
                    openCameraBtn.onclick = () => {
                        startCameraModal();
                    };
                }

                const submitAuthBtn = document.getElementById('submit-auth-btn');
                if (submitAuthBtn) {
                    submitAuthBtn.onclick = () => {
                        if (!state.imagePreview) {
                            showMessage("인증 사진을 먼저 등록함.");
                            return;
                        }

                        state.streak += 1;
                        localStorage.setItem('morning_study_streak', state.streak);

                        const newFeedItem = {
                            nickname: state.nickname,
                            streak: state.streak,
                            resolution: state.resolution,
                            image: state.imagePreview,
                            timestamp: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                        };

                        state.feedList.unshift(newFeedItem);
                        localStorage.setItem('morning_study_feed', JSON.stringify(state.feedList));

                        const isConnected = state.gasUrl && !state.gasUrl.includes("여기에");
                        if (isConnected) {
                            syncWithGAS(newFeedItem);
                        }

                        showMessage("오늘의 아침 공부 인증이 완료됨! 수고함.", () => {
                            state.currentTab = 'feed';
                            render();
                            if (isConnected) {
                                fetchFeedFromGAS();
                            }
                        });
                    };
                }
            } else if (state.currentTab === 'feed') {
                const refreshBtn = document.getElementById('refresh-feed-btn');
                if (refreshBtn) {
                    refreshBtn.onclick = () => {
                        fetchFeedFromGAS();
                    };
                }
            }
        }

        function startCameraModal() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('camera-video');
            modal.classList.remove('hidden');

            // 후면 카메라 우선 지정 (모바일 환경 대응)
            const constraints = {
                video: { facingMode: { ideal: 'environment' } },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    mediaStream = stream;
                    video.srcObject = stream;
                })
                .catch(err => {
                    console.error("카메라 접근 오류:", err);
                    // 전면 카메라 또는 기본 카메라로 재시도
                    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                        .then(stream => {
                            mediaStream = stream;
                            video.srcObject = stream;
                        })
                        .catch(fallbackErr => {
                            console.error("기본 카메라 접근도 실패함:", fallbackErr);
                            modal.classList.add('hidden');
                            showMessage("기기 카메라 권한이 차단되었거나 지원되지 않음. 파일 등록을 이용함.");
                        });
                });

            document.getElementById('close-camera-btn').onclick = () => {
                stopCameraStream();
                modal.classList.add('hidden');
            };

            document.getElementById('capture-btn').onclick = () => {
                const canvas = document.getElementById('camera-canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                state.imagePreview = canvas.toDataURL('image/jpeg', 0.85);
                localStorage.setItem('morning_study_image', state.imagePreview);
                
                stopCameraStream();
                modal.classList.add('hidden');
                render();
            };
        }

        function stopCameraStream() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function syncWithGAS(data) {
            const isConnected = state.gasUrl && !state.gasUrl.includes("여기에");
            if (!isConnected) return;
            fetch(state.gasUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            }).then(() => {
                console.log("GAS 데이터 전송 완료함.");
            }).catch(err => {
                console.error("GAS 전송 오류 발생함:", err);
            });
        }

        function fetchFeedFromGAS() {
            const isConnected = state.gasUrl && !state.gasUrl.includes("여기에");
            if (!isConnected) return;
            state.isLoadingFeed = true;
            render();

            fetch(state.gasUrl)
                .then(res => res.json())
                .then(resData => {
                    if (resData && resData.status === 'success' && Array.isArray(resData.data)) {
                        state.feedList = resData.data;
                        localStorage.setItem('morning_study_feed', JSON.stringify(state.feedList));
                    }
                    state.isLoadingFeed = false;
                    render();
                })
                .catch(err => {
                    console.error("GAS 피드 조회 오류 발생함:", err);
                    state.isLoadingFeed = false;
                    render();
                });
        }

        window.onload = function() {
            render();
            const isConnected = state.gasUrl && !state.gasUrl.includes("여기에");
            if (isConnected && state.isLoggedIn) {
                fetchFeedFromGAS();
            }
        };
    </script>
</body>
</html>
